[platformio]
test_dir = ../test/firmware
; The PWA ships in device flash and is served at / (HANDOVER section 3, revised).
; Point the filesystem image straight at webapp/ instead of copying files into
; firmware/data — one line, and the served app can never drift from the source.
;   pio run -t uploadfs      # build + flash the LittleFS image
data_dir = ../webapp

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 8MB PSRAM (ESP32-S3R8) — octal SPI
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DASYNCWEBSERVER_REGEX

lib_deps =
  lovyan03/LovyanGFX@^1.1.16
  esp32async/ESPAsyncWebServer@^3.6.0
  esp32async/AsyncTCP@^3.3.2
  bblanchon/ArduinoJson@^7.2.0

; Pure-logic unit tests only (no Arduino, no hardware). See /test/firmware.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -I src
